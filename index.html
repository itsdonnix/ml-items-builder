<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="https://itsdonnix.github.io/ml-items-builder/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Plan the best Mobile Legends: Bang Bang item builds for every hero. Create, share, and optimize MLBB builds with top item combinations, emblems, and strategies to rank up faster."
    />
    <link rel="canonical" href="https://itsdonnix.github.io/ml-items-builder/" />
    <meta property="og:title" content="Mobile Legends Items Builder" />
    <meta
      property="og:description"
      content="Create, share, and optimize MLBB item builds for every hero."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://itsdonnix.github.it/ml-items-builder/" />
    <title>Mobile Legends Items Builder</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@300;400;500;600;700&family=Space+Grotesk:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    />
    <style>
      #app {
        opacity: 0;
      }
      #app.ready {
        opacity: 1;
        transition: opacity 0.5s ease;
      }

      body {
        margin: 0;
        font-family: 'Space Grotesk', sans-serif;
        height: 100vh;
        overflow: hidden;
        background-color: var(--bg, #f0f0f5);
      }
      .app-header {
        height: 56px;
      }
      .deck-wrap {
        height: calc(100vh - 56px);
        overflow: hidden;
      }

      /* Fancy Loader Styles */
      .loader-wrapper {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: #f0f0f5;
        transition:
          opacity 0.6s ease-in-out,
          visibility 0.6s;
      }

      .loader-wrapper.hidden {
        opacity: 0;
        visibility: hidden;
      }

      .loader-visual {
        position: relative;
        width: 120px;
        height: 120px;
        margin-bottom: 24px;
      }

      .loader-sword {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        font-size: 3rem;
        color: #1a1a2e;
        z-index: 2;
        animation: floatIcon 2s ease-in-out infinite;
        text-shadow: 0 4px 12px rgba(0, 0, 0, 0.1);
      }

      .loader-circle {
        position: absolute;
        inset: 0;
        border-radius: 50%;
        border: 4px solid transparent;
        border-top-color: #b8860b; /* Accent */
        animation: spin 1.5s linear infinite;
      }

      .loader-circle::before {
        content: '';
        position: absolute;
        inset: 8px;
        border-radius: 50%;
        border: 4px solid transparent;
        border-top-color: #059669; /* Hero */
        animation: spin 2s linear infinite reverse;
      }

      .loader-circle::after {
        content: '';
        position: absolute;
        inset: 20px;
        border-radius: 50%;
        border: 4px solid transparent;
        border-top-color: #9333ea; /* Emblem */
        animation: spin 3s linear infinite;
      }

      .loader-text {
        font-family: 'Rajdhani', sans-serif;
        font-size: 1.5rem;
        font-weight: 700;
        letter-spacing: 2px;
        color: #1a1a2e;
        text-transform: uppercase;
        animation: pulseText 2s ease-in-out infinite;
      }

      .loader-sub {
        margin-top: 8px;
        font-size: 0.9rem;
        color: #8888a0;
        font-weight: 500;
      }

      @keyframes spin {
        0% {
          transform: rotate(0deg);
        }
        100% {
          transform: rotate(360deg);
        }
      }

      @keyframes floatIcon {
        0%,
        100% {
          transform: translate(-50%, -50%) translateY(0);
        }
        50% {
          transform: translate(-50%, -50%) translateY(-8px);
        }
      }

      @keyframes pulseText {
        0%,
        100% {
          opacity: 0.8;
        }
        50% {
          opacity: 1;
        }
      }

      .noscript-msg {
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100vh;
        margin: 0;
        font-family: 'Space Grotesk', sans-serif;
        background: #f0f0f5;
        color: #1a1a2e;
        text-align: center;
        padding: 2rem;
        box-sizing: border-box;
      }
      .noscript-msg h1 {
        font-size: 1.5rem;
        margin: 0 0 0.5rem;
      }
      .noscript-msg p {
        font-size: 1rem;
        margin: 0;
        color: #44445a;
      }

      :root {
        --bg: #f0f0f5;
        --bg2: #e6e6ee;
        --card: #fff;
        --card-h: #f5f5fa;
        --border: #d0d0dc;
        --text: #1a1a2e;
        --text2: #44445a;
        --muted: #8888a0;
        --accent: #b8860b;
        --accent-h: #d4a634;
        --accent-dim: rgba(184, 134, 11, 0.08);
        --hero: #059669;
        --hero-dim: rgba(5, 150, 105, 0.06);
        --build: #d97706;
        --build-dim: rgba(217, 119, 6, 0.06);
        --best: #16a34a;
        --best-dim: rgba(22, 163, 74, 0.06);
        --emblem: #9333ea;
        --emblem-dim: rgba(147, 51, 234, 0.06);
        --danger: #dc2626;
        --shadow: 0 4px 24px rgba(0, 0, 0, 0.06);
        --cat-boots: #92702c;
        --cat-attack: #c0392b;
        --cat-magic: #8e44ad;
        --cat-defense: #2980b9;
        --cat-jungle: #27ae60;
        --font-d: 'Rajdhani', sans-serif;
        --font-u: 'Space Grotesk', sans-serif;
      }

      @media (prefers-reduced-motion: reduce) {
        * {
          animation-duration: 0s !important;
          transition-duration: 0s !important;
        }
      }
    </style>
    <script>
      // Prevent dark-theme flash before Vue hydrates
      ;(function () {
        try {
          if (localStorage.getItem('mlb-theme') === 'dark') {
            document.documentElement.setAttribute('data-theme', 'dark')
            var link = document.createElement('link')
            link.rel = 'stylesheet'
            link.href = 'dark-theme.css'
            document.head.appendChild(link)
          }
        } catch (e) {
          console.error(e)
        }
      })()

      // Debounce loader: only show if page takes >= 200ms
      ;(function () {
        var timer = null
        window.__showLoader = function () {
          clearTimeout(timer)
          timer = setTimeout(function () {
            var el = document.getElementById('loader')
            if (el) el.style.visibility = 'visible'
          }, 200)
        }
        window.__hideLoader = function () {
          clearTimeout(timer)
          var el = document.getElementById('loader')
          if (el) el.style.visibility = 'hidden'
        }
      })()
    </script>
    <script type="module" crossorigin src="https://itsdonnix.github.io/ml-items-builder/assets/index-DNbDAyJE.js"></script>
    <link rel="stylesheet" crossorigin href="https://itsdonnix.github.io/ml-items-builder/assets/index-BCSbaGpq.css">
  </head>
  <body>
    <!-- Fancy Loader (hidden by default, shown after 200ms debounce) -->
    <div id="loader" class="loader-wrapper" style="visibility: hidden">
      <div class="loader-visual">
        <div class="loader-sword"><i class="fa-solid fa-shield-halved"></i></div>
        <div class="loader-circle"></div>
      </div>
      <div class="loader-text">MLBB Builder</div>
      <div class="loader-sub">Preparing Battle Gear...</div>
    </div>

    <noscript>
      <div class="noscript-msg">
        <div>
          <h1>Mobile Legends Items Builder</h1>
          <p>
            Plan and optimize the best Mobile Legends item builds for every hero. Explore powerful
            MLBB strategies, item combinations, and emblems. Please enable JavaScript to use the
            full interactive builder.
          </p>
        </div>
      </div>
    </noscript>
    <div id="app"></div>
  </body>
</html>
